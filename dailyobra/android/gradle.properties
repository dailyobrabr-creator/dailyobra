# trustStore: certificados usados só pelo Gradle deste app (padrão do Java + o do Avast Web Shield, que intercepta
# HTTPS neste computador). O arquivo é criado por tool\certificados_gradle.ps1. Em outro computador sem Avast,
# apague as duas opções -Djavax.net.ssl.* abaixo; com Avast, rode o script lá também.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStore=C:/Users/luizh/.gradle/dailyobra-certificados.jks -Djavax.net.ssl.trustStorePassword=changeit
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Projeto no D: e cache do pub no C: quebram o Kotlin incremental ("this and base files have different
# roots"), igual nos apps ass.sans e agroop. Builds um pouco mais lentos, sem esse erro.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
