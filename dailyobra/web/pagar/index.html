<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pagamento do pedido · DailyObra</title>
  <link rel="icon" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --laranja: #F36E21; --botao: #A43F05; --texto: #1C1B1A; --suave: #5E5A57; --borda: #E7E2DE;
      --fundo: #F8F6F4; --cartao: #FFFFFF; --erro: #B3261E; --campo: #CFC8C2; --codigo: #F3EFEC;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--fundo); color: var(--texto); }
    main { max-width: 480px; margin: 0 auto; padding: 16px; }
    header { padding: 4px 0 16px; font-weight: 700; font-size: 20px; letter-spacing: -0.2px; }
    header span { color: var(--laranja); }
    .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    h1 { font-size: 19px; margin: 0 0 4px; line-height: 1.3; }
    h2 { font-size: 15px; margin: 0 0 6px; }
    p { margin: 4px 0 0; }
    .suave { color: var(--suave); font-size: 14px; line-height: 1.45; }
    a { color: var(--botao); font-weight: 600; }
    .linha { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 14px; border-top: 1px solid var(--borda); }
    .linha:first-of-type { border-top: 0; }
    .linha > span:first-child { min-width: 0; overflow-wrap: anywhere; }
    .linha > span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .total { font-size: 20px; font-weight: 700; }
    label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
    input { width: 100%; font: inherit; font-size: 16px; padding: 12px; border: 1px solid var(--campo); border-radius: 12px; background: #fff; color: var(--texto); }
    input:focus { outline: 2px solid var(--laranja); outline-offset: 1px; }
    button { width: 100%; font: inherit; font-weight: 700; font-size: 16px; padding: 14px; border: 0; border-radius: 12px;
      background: var(--botao); color: #fff; cursor: pointer; margin-top: 14px; }
    button.secundario { background: transparent; color: var(--botao); border: 1.5px solid var(--botao); }
    button:disabled { opacity: .6; cursor: default; }
    .erro { color: var(--erro); font-size: 14px; margin-top: 12px; }
    .qr { display: flex; justify-content: center; margin: 12px 0; }
    .qr svg { width: 220px; height: 220px; }
    .codigo { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--codigo);
      border-radius: 10px; padding: 10px; overflow-wrap: anywhere; word-break: break-all; user-select: all; }
    .estado { text-align: center; padding: 24px 16px; }
    .estado .icone { font-size: 40px; line-height: 1; margin-bottom: 8px; }
    footer { text-align: center; margin: 8px 0 24px; }
  </style>
</head>
<body>
  <main>
    <header>Daily<span>Obra</span></header>
    <div id="app"><div class="cartao suave">Carregando o pedido…</div></div>
    <footer class="suave">O pagamento vai direto para a loja. A DailyObra não recebe nem guarda o seu dinheiro.</footer>
  </main>
  <script src="qrcode.min.js"></script>
  <script>
    // Mesmos valores de SupabaseConfig (dailyobra_comum): endereço do projeto e chave publicável.
    const SUPABASE_URL = 'https://wlqtwaiqtwxmmndlunvh.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MhBkxHBPSukvO6-d3zxiBw_w7isbqmV';
    const LINK_INVALIDO = 'Link inválido ou substituído.';

    const codigo = new URLSearchParams(location.search).get('c');
    const app = document.getElementById('app');
    const brl = (v) => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const qtd = (v) => Number(v).toLocaleString('pt-BR', { maximumFractionDigits: 3 });
    const escapar = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const digitos = (s) => String(s).replace(/\D/g, '');

    // Mesma conta do banco (private.cpf_valido e private.cnpj_valido).
    function cpfValido(d) {
      if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
      const dv = (n) => { let s = 0; for (let i = 0; i < n; i++) s += +d[i] * (n + 1 - i); const r = (s * 10) % 11; return r === 10 ? 0 : r; };
      return dv(9) === +d[9] && dv(10) === +d[10];
    }
    function cnpjValido(d) {
      if (d.length !== 14 || /^(\d)\1{13}$/.test(d)) return false;
      const dv = (n) => {
        const pesos = n === 12 ? [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2] : [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
        let s = 0; for (let i = 0; i < n; i++) s += +d[i] * pesos[i];
        const r = s % 11; return r < 2 ? 0 : 11 - r;
      };
      return dv(12) === +d[12] && dv(13) === +d[13];
    }
    function documentoValido(s) {
      const d = digitos(s);
      return d.length === 11 ? cpfValido(d) : d.length === 14 ? cnpjValido(d) : false;
    }

    async function rpc(funcao, corpo) {
      let resposta;
      try {
        resposta = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${funcao}`, {
          method: 'POST',
          headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify(corpo),
        });
      } catch {
        throw new Error('Sem conexão. Confira a internet e tente de novo.');
      }
      const dados = await resposta.json().catch(() => null);
      if (!resposta.ok) throw new Error((dados && dados.message) || 'Não deu para falar com o servidor. Tente de novo.');
      return dados;
    }

    function estado(icone, titulo, texto) {
      return `<div class="cartao estado"><div class="icone">${icone}</div><h1>${titulo}</h1><p class="suave">${texto}</p></div>`;
    }

    function resumo(p) {
      const soma = p.itens.reduce((s, i) => s + Number(i.total), 0);
      const desconto = Number(p.desconto || 0);
      const frete = Number(p.frete || 0);
      const total = Number(p.total);
      // Saldo da carteira que o construtor usou no pedido: é o que falta para os números fecharem
      const saldo = Math.round((soma - desconto + frete - total) * 100) / 100;
      // Link pronto do banco: o 55 entra só quando a loja salvou DDD + número
      const zap = p.loja.whatsapp_link;
      return `
        <div class="cartao">
          <h1>${escapar(p.loja.nome)}</h1>
          <p class="suave">${escapar(p.loja.cidade)} - ${escapar(p.loja.uf)}${zap ? ` · <a href="${escapar(zap)}" target="_blank" rel="noopener">Falar com a loja</a>` : ''}</p>
        </div>
        <div class="cartao">
          <h2>Materiais</h2>
          ${p.itens.map((i) => `
            <div class="linha">
              <span>${qtd(i.quantidade)} ${escapar(i.unidade)} · ${escapar(i.nome)}<br><small class="suave">${brl(i.preco)} cada</small></span>
              <span>${brl(i.total)}</span>
            </div>`).join('')}
          ${desconto > 0 ? `<div class="linha"><span>Desconto da loja</span><span>- ${brl(desconto)}</span></div>` : ''}
          <div class="linha"><span>Frete</span><span>${brl(frete)}</span></div>
          ${saldo > 0.009 ? `<div class="linha"><span>Saldo DailyObra usado</span><span>- ${brl(saldo)}</span></div>` : ''}
          <div class="linha total"><span>Total</span><span>${brl(total)}</span></div>
        </div>`;
    }

    // Corrigindo: o PIX já estava na tela e dá para voltar a ele sem mudar nada
    function formulario(p, corrigindo = false) {
      return `
        <div class="cartao">
          <h2>Dados para a nota fiscal</h2>
          <p class="suave">A nota sai no nome e no CPF ou CNPJ de quem paga.</p>
          <label for="nome">Seu nome</label>
          <input id="nome" autocomplete="name" value="${escapar(p.pagador_nome || '')}">
          <label for="doc">CPF ou CNPJ</label>
          <input id="doc" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00">
          <div id="erro" class="erro" hidden></div>
          <button id="continuar">Continuar</button>
          ${corrigindo ? '<button id="voltar" class="secundario">Voltar</button>' : ''}
        </div>`;
    }

    // O documento inteiro nunca sai na página: só o mascarado do banco
    function pagamento(p) {
      const nota = p.documento_mascarado
        ? `<div class="linha"><span>Nota no CPF/CNPJ ${escapar(p.documento_mascarado)}</span><a href="#" id="corrigir">Corrigir</a></div>`
        : '';
      return `
        <div class="cartao">
          <h2>Pague com PIX</h2>
          ${nota}
          <p class="suave">Abra o app do seu banco, escolha PIX e leia o QR ou cole o código. O valor de ${brl(p.total)} já vem preenchido.</p>
          <div class="qr" id="qr"></div>
          <div class="codigo" id="codigo">${escapar(p.pix)}</div>
          <button id="copiar" class="secundario">Copiar</button>
          <div id="erro" class="erro" hidden></div>
          ${p.automatico
            ? '<p class="suave">Assim que o banco confirmar, esta página atualiza sozinha.</p>'
            : '<button id="paguei">Já paguei</button>'}
        </div>`;
    }

    function ligar(p) {
      const caixaErro = document.getElementById('erro');
      const mostrarErro = (m) => { caixaErro.textContent = m; caixaErro.hidden = false; };

      const qr = document.getElementById('qr');
      if (qr) {
        const q = qrcode(0, 'M');
        q.addData(p.pix);
        q.make();
        qr.innerHTML = q.createSvgTag(4, 2);
      }

      if (p.automatico) vigiar();

      const copiar = document.getElementById('copiar');
      if (copiar) copiar.onclick = async () => {
        try {
          await navigator.clipboard.writeText(p.pix);
          copiar.textContent = 'Código copiado';
        } catch {
          const faixa = document.createRange();
          faixa.selectNodeContents(document.getElementById('codigo'));
          getSelection().removeAllRanges();
          getSelection().addRange(faixa);
          copiar.textContent = 'Código selecionado: copie pelo menu';
        }
      };

      const paguei = document.getElementById('paguei');
      if (paguei) paguei.onclick = async () => {
        paguei.disabled = true;
        try {
          await rpc('avisar_pagamento', { p_codigo: codigo });
          await carregar();
        } catch (e) {
          mostrarErro(e.message);
          paguei.disabled = false;
        }
      };

      const corrigir = document.getElementById('corrigir');
      if (corrigir) corrigir.onclick = (e) => {
        e.preventDefault();
        mostrar(p, true);
      };

      const voltar = document.getElementById('voltar');
      if (voltar) voltar.onclick = () => mostrar(p);

      const continuar = document.getElementById('continuar');
      if (continuar) continuar.onclick = async () => {
        const nome = document.getElementById('nome').value.trim();
        const doc = document.getElementById('doc').value;
        if (nome.length < 2) return mostrarErro('Informe seu nome.');
        if (!documentoValido(doc)) return mostrarErro('CPF ou CNPJ inválido. Confira os números.');
        continuar.disabled = true;
        try {
          await rpc('dados_do_pagador', { p_codigo: codigo, p_nome: nome, p_documento: digitos(doc) });
          await carregar();
        } catch (e) {
          mostrarErro(e.message);
          continuar.disabled = false;
        }
      };
    }

    // A situação do banco manda; com os dados já enviados e sem PIX (loja sem chave), não volta ao formulário.
    // Corrigir reabre o formulário enquanto o pagamento está em aberto (dados_do_pagador regrava).
    function tela(p, corrigindo = false) {
      if (p.situacao === 'pago' || p.situacao === 'cancelado' || p.situacao === 'informado') return p.situacao;
      if (corrigindo) return 'formulario';
      if (p.pix) return 'pagamento';
      return p.documento_informado ? 'sem_chave' : 'formulario';
    }

    function mostrar(p, corrigindo = false) {
      clearInterval(vigia);
      const t = tela(p, corrigindo);
      let corpo;
      if (t === 'pago') corpo = estado('✅', 'Pagamento confirmado.', 'A loja segue com a separação e a entrega dos materiais.');
      else if (t === 'cancelado') corpo = estado('⛔', 'Este pedido foi cancelado.', 'Fale com quem montou o orçamento para saber o que mudou.');
      else if (t === 'informado') corpo = estado('⏳', 'Pronto! A loja vai conferir o pagamento e confirmar.', 'Você não precisa fazer mais nada por aqui.');
      else if (t === 'sem_chave') corpo = estado('💬', 'A loja ainda não cadastrou a chave PIX.', 'Seus dados para a nota foram recebidos. Fale com a loja para combinar o pagamento.');
      else corpo = t === 'pagamento' ? pagamento(p) : formulario(p, corrigindo);
      app.innerHTML = resumo(p) + corpo;
      if (document.getElementById('erro')) ligar(p);
    }

    function invalido() {
      app.innerHTML = estado('🔗', 'Link inválido', 'Este link foi substituído ou não existe. Peça um link novo a quem montou o orçamento.');
    }

    // Com a loja no Asaas o PIX vira uma cobrança que confirma sozinha. Sem isso, ou se falhar, fica o PIX da chave da loja.
    async function comPixAutomatico(p) {
      if (tela(p) !== 'pagamento') return p;
      try {
        const resposta = await fetch(`${SUPABASE_URL}/functions/v1/pix-asaas`, {
          method: 'POST',
          headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ acao: 'cobrar', codigo }),
        });
        const dados = await resposta.json();
        if (resposta.ok && dados.codigo) return { ...p, pix: dados.codigo, automatico: true };
      } catch {
        // Segue com a chave da loja
      }
      return p;
    }

    // O aviso do banco chega no servidor: a página pergunta de tempos em tempos até o pedido sair de "aguardando"
    let vigia;
    function vigiar() {
      vigia = setInterval(async () => {
        try {
          const p = await rpc('pedido_do_link', { p_codigo: codigo });
          if (p.situacao === 'pago' || p.situacao === 'cancelado') mostrar(p);
        } catch {
          // Tenta de novo na próxima volta
        }
      }, 5000);
    }

    async function carregar() {
      if (!codigo) return invalido();
      try {
        mostrar(await comPixAutomatico(await rpc('pedido_do_link', { p_codigo: codigo })));
      } catch (e) {
        if (e.message === LINK_INVALIDO) return invalido();
        app.innerHTML = estado('⚠️', 'Não deu para abrir o pedido', escapar(e.message)) +
          '<button id="denovo" class="secundario">Tentar de novo</button>';
        document.getElementById('denovo').onclick = carregar;
      }
    }

    carregar();
  </script>
</body>
</html>
