name: dailyobra_parceiro
description: "DailyObra Parceiros: painel das lojas no marketplace da construção"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dailyobra_comum:
    path: ../dailyobra_comum

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  # 8.x: a 9.0 passou a usar o pacote material_ui e o TextTheme dela não é o do Flutter
  google_fonts: 8.0.0
  intl: ^0.20.3
  # Busca do CEP no ViaCEP (a mesma versão que o supabase já trazia)
  http: ^1.6.0
  shared_preferences: ^2.5.3
  # Logo e capa da loja: escolhe da galeria já reduzida (largura máxima e qualidade JPEG)
  image_picker: ^1.2.3
  file_picker: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.12.0

flutter:
  uses-material-design: true

# Ícone: o capacete do DailyObra em branco e laranja sobre o grafite da marca (#565966),
# para não confundir com o app do construtor (fundo branco).
# Para refazer: dart run tool/gerar_icone.dart  e  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icone/icone.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#565966"
  adaptive_icon_foreground: "assets/icone/icone_frente.png"
  # Painel na web: favicon e ícones do manifest
  web:
    generate: true
    image_path: "assets/icone/icone.png"
    background_color: "#F6F7F9"
    theme_color: "#F36E21"
